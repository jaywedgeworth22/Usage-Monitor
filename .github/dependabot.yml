version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # TEMPORARY (instinct): vitest 5 majors blocked until @cloudflare/vitest-plugin
    # (successor to vitest-pool-workers, EOL at 0.22.0) ships vitest 5 support;
    # both currently peer vitest ^4.1. Remove in the combined vitest-5 upgrade PR
    # that replaces #1522/#1523.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
