name: E2E smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This throwaway SQLite smoke job has no Datadog agent or production secrets.
    env:
      DD_TRACE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: echo "DATABASE_URL=file:${RUNNER_TEMP}/api-usage-monitor-e2e.db" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: npx playwright test
